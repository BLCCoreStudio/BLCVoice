name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Cargo lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Validate committed dependency graph
        run: cargo +1.98.0 metadata --locked --no-deps --format-version 1 > /dev/null

  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Test platform-independent core
        run: cargo +1.98.0 test --locked -p blcvoice-core -p blcvoice-audio-processing -p blcvoice-asr -p blcvoice-vad -p blcvoice-vad-silero -p blcvoice-dictation -p blcvoice-runtime -p blcvoice-platform -p blcvoice-shortcuts -p blcvoice-insertion -p blcvoice-insertion-eis -p blcvoice-insertion-x11 -p blcvoice-insertion-native --all-targets

  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +1.98.0 fmt --all -- --check
      - name: Run Clippy on runtime-independent crates
        run: cargo +1.98.0 clippy --locked -p blcvoice-core -p blcvoice-audio -p blcvoice-audio-processing -p blcvoice-asr -p blcvoice-vad -p blcvoice-vad-silero -p blcvoice-dictation -p blcvoice-runtime -p blcvoice-platform -p blcvoice-shortcuts -p blcvoice-insertion -p blcvoice-insertion-eis -p blcvoice-insertion-x11 -p blcvoice-insertion-native --all-targets -- -D warnings

  x11-insertion:
    name: X11 insertion smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Exercise XTEST against a live X server
        run: xvfb-run -a cargo +1.98.0 test --locked -p blcvoice-insertion-x11 --test live_x11 -- --ignored

  audio:
    name: Audio backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux audio prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - name: Test audio crates
        run: cargo +1.98.0 test --locked -p blcvoice-audio -p blcvoice-audio-cpal --all-targets
      - name: Lint audio crates
        run: cargo +1.98.0 clippy --locked -p blcvoice-audio -p blcvoice-audio-cpal --all-targets -- -D warnings

  asr:
    name: ASR adapter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - name: Test ASR crates
        run: cargo +1.98.0 test --locked -p blcvoice-asr -p blcvoice-asr-transcribe --all-targets
      - name: Lint ASR crates
        run: cargo +1.98.0 clippy --locked -p blcvoice-asr -p blcvoice-asr-transcribe --all-targets -- -D warnings

  desktop-linux:
    name: Desktop shell (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate desktop UI JavaScript
        run: node --check apps/desktop/ui/app.js
      - name: Validate Tauri configuration JSON
        run: python3 -m json.tool apps/desktop/src-tauri/tauri.conf.json > /dev/null
      - name: Install Tauri and audio prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - name: Test desktop shell
        run: cargo +1.98.0 test --locked -p blcvoice-desktop --all-targets
      - name: Lint desktop shell
        run: cargo +1.98.0 clippy --locked -p blcvoice-desktop --all-targets -- -D warnings

  desktop-native:
    name: Desktop shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - name: Test desktop shell
        run: cargo +1.98.0 test --locked -p blcvoice-desktop --all-targets
      - name: Lint desktop shell
        run: cargo +1.98.0 clippy --locked -p blcvoice-desktop --all-targets -- -D warnings
