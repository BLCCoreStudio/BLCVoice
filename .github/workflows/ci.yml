name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Cargo lockfile bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Resolve dependency graph
        run: cargo +1.98.0 generate-lockfile
      - name: Detect lockfile change
        id: lock
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit refreshed lockfile to the PR branch
        if: steps.lock.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: lock audio dependencies"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Reject stale lockfile outside pull requests
        if: steps.lock.outputs.changed == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          echo "Cargo.lock must be committed and up to date." >&2
          exit 1

  core:
    name: Core (${{ matrix.os }})
    needs: lockfile
    if: needs.lockfile.outputs.changed == 'false'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Test platform-independent core
        run: cargo +1.98.0 test --locked -p blcvoice-core --all-targets

  quality:
    name: Rust quality
    needs: lockfile
    if: needs.lockfile.outputs.changed == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +1.98.0 fmt --all -- --check
      - name: Run Clippy on dependency-free crates
        run: cargo +1.98.0 clippy --locked -p blcvoice-core -p blcvoice-audio --all-targets -- -D warnings

  audio:
    name: Audio backend (${{ matrix.os }})
    needs: lockfile
    if: needs.lockfile.outputs.changed == 'false'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux audio prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - name: Test audio crates
        run: cargo +1.98.0 test --locked -p blcvoice-audio -p blcvoice-audio-cpal --all-targets
      - name: Lint audio crates
        run: cargo +1.98.0 clippy --locked -p blcvoice-audio -p blcvoice-audio-cpal --all-targets -- -D warnings

  desktop-linux:
    name: Desktop shell (Linux)
    needs: lockfile
    if: needs.lockfile.outputs.changed == 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Check desktop shell
        run: cargo +1.98.0 check --locked -p blcvoice-desktop --all-targets
