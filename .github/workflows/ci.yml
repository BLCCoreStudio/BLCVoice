name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Cargo lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Validate committed dependency graph
        run: cargo +1.98.0 metadata --locked --no-deps --format-version 1 > /dev/null

  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Test platform-independent core
        run: cargo +1.98.0 test --locked -p blcvoice-core -p blcvoice-audio-processing -p blcvoice-asr -p blcvoice-vad -p blcvoice-vad-silero -p blcvoice-dictation -p blcvoice-runtime -p blcvoice-platform -p blcvoice-shortcuts -p blcvoice-insertion -p blcvoice-insertion-eis -p blcvoice-insertion-x11 -p blcvoice-insertion-native --all-targets
      - name: Validate accuracy scorer
        if: runner.os != 'Windows'
        run: python3 scripts/score-accuracy.py --self-test
      - name: Validate accuracy scorer (Windows)
        if: runner.os == 'Windows'
        run: python scripts/score-accuracy.py --self-test
      - name: Smoke-test native resource wrapper
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/measure-resource.sh -- sh -c 'exit 0' > resource-smoke.txt 2>/dev/null
          grep -Fx 'resource_format=blcvoice-resource-evidence-v1' resource-smoke.txt
          grep -Fx 'resource_command_exit_code=0' resource-smoke.txt
      - name: Smoke-test native resource wrapper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./scripts/measure-resource.ps1 -FilePath $env:ComSpec -ArgumentList @('/d', '/c', 'exit 0') | Tee-Object resource-smoke.txt
          if (-not (Select-String -Path resource-smoke.txt -SimpleMatch 'resource_format=blcvoice-resource-evidence-v1')) { exit 1 }
          if (-not (Select-String -Path resource-smoke.txt -SimpleMatch 'resource_command_exit_code=0')) { exit 1 }

  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +1.98.0 fmt --all -- --check
      - name: Run Clippy on runtime-independent crates
        run: cargo +1.98.0 clippy --locked -p blcvoice-core -p blcvoice-audio -p blcvoice-audio-processing -p blcvoice-asr -p blcvoice-vad -p blcvoice-vad-silero -p blcvoice-dictation -p blcvoice-runtime -p blcvoice-platform -p blcvoice-shortcuts -p blcvoice-insertion -p blcvoice-insertion-eis -p blcvoice-insertion-x11 -p blcvoice-insertion-native --all-targets -- -D warnings

  x11-insertion:
    name: X11 insertion smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Exercise XTEST against a live X server
        run: xvfb-run -a cargo +1.98.0 test --locked -p blcvoice-insertion-x11 --test live_x11 -- --ignored

  audio:
    name: Audio backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux audio prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - name: Test audio crates
        run: cargo +1.98.0 test --locked -p blcvoice-audio -p blcvoice-audio-cpal --all-targets
      - name: Lint audio crates
        run: cargo +1.98.0 clippy --locked -p blcvoice-audio -p blcvoice-audio-cpal --all-targets -- -D warnings

  asr:
    name: ASR adapter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - name: Test ASR crates
        run: cargo +1.98.0 test --locked -p blcvoice-asr -p blcvoice-asr-transcribe --all-targets
      - name: Lint ASR crates
        run: cargo +1.98.0 clippy --locked -p blcvoice-asr -p blcvoice-asr-transcribe --all-targets -- -D warnings

  desktop-linux:
    name: Desktop shell (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate desktop UI JavaScript
        run: |
          node --check apps/desktop/ui/app.js
          node --check apps/desktop/ui/overlay.js
      - name: Validate Tauri configuration JSON
        run: |
          python3 -m json.tool apps/desktop/src-tauri/tauri.conf.json > /dev/null
          python3 -m json.tool apps/desktop/src-tauri/capabilities/default.json > /dev/null
          python3 -m json.tool apps/desktop/src-tauri/capabilities/overlay.json > /dev/null
      - name: Install Tauri and audio prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - name: Test desktop shell
        run: cargo +1.98.0 test --locked -p blcvoice-desktop --all-targets
      - name: Lint desktop shell
        run: cargo +1.98.0 clippy --locked -p blcvoice-desktop --all-targets -- -D warnings

  desktop-native:
    name: Desktop shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - name: Test desktop shell
        run: cargo +1.98.0 test --locked -p blcvoice-desktop --all-targets
      - name: Lint desktop shell
        run: cargo +1.98.0 clippy --locked -p blcvoice-desktop --all-targets -- -D warnings

  critical-validation:
    name: Critical validation gate
    if: ${{ always() }}
    needs:
      - lockfile
      - core
      - quality
      - x11-insertion
      - audio
      - asr
      - desktop-linux
      - desktop-native
    runs-on: ubuntu-latest
    steps:
      - name: Require every critical validation job to succeed
        env:
          LOCKFILE_RESULT: ${{ needs.lockfile.result }}
          CORE_RESULT: ${{ needs.core.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          X11_INSERTION_RESULT: ${{ needs.x11-insertion.result }}
          AUDIO_RESULT: ${{ needs.audio.result }}
          ASR_RESULT: ${{ needs.asr.result }}
          DESKTOP_LINUX_RESULT: ${{ needs.desktop-linux.result }}
          DESKTOP_NATIVE_RESULT: ${{ needs.desktop-native.result }}
        shell: bash
        run: |
          failed=0
          for result in \
            "$LOCKFILE_RESULT" \
            "$CORE_RESULT" \
            "$QUALITY_RESULT" \
            "$X11_INSERTION_RESULT" \
            "$AUDIO_RESULT" \
            "$ASR_RESULT" \
            "$DESKTOP_LINUX_RESULT" \
            "$DESKTOP_NATIVE_RESULT"; do
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo "At least one critical validation dependency did not succeed." >&2
            printf 'lockfile=%s\ncore=%s\nquality=%s\nx11-insertion=%s\naudio=%s\nasr=%s\ndesktop-linux=%s\ndesktop-native=%s\n' \
              "$LOCKFILE_RESULT" \
              "$CORE_RESULT" \
              "$QUALITY_RESULT" \
              "$X11_INSERTION_RESULT" \
              "$AUDIO_RESULT" \
              "$ASR_RESULT" \
              "$DESKTOP_LINUX_RESULT" \
              "$DESKTOP_NATIVE_RESULT" >&2
            exit 1
          fi

          echo "All critical validation dependencies succeeded."
