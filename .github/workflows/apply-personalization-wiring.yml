name: Apply personalization wiring

on:
  push:
    branches:
      - feat/v1-history-personalization
    paths:
      - .github/workflows/apply-personalization-wiring.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1-history-personalization
          fetch-depth: 0

      - name: Install desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libpipewire-0.3-dev libpulse-dev

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt,clippy

      - name: Patch desktop personalization wiring
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          ipc_path = Path("apps/desktop/src-tauri/src/ipc.rs")
          ipc = ipc_path.read_text()
          ipc = replace_once(ipc, 'use blcvoice_insertion::{InsertionError, InsertionErrorKind, InsertionReceipt};\nuse serde::Serialize;', 'use blcvoice_insertion::{InsertionError, InsertionErrorKind, InsertionReceipt};\nuse blcvoice_personalization::PersonalizationError;\nuse serde::Serialize;', "ipc personalization import")
          ipc = replace_once(ipc, 'use crate::models::{ModelError, ModelErrorKind, ModelManager, ModelStatus};\nuse crate::settings::{AppSettings, SettingsError, SettingsService};', 'use crate::models::{ModelError, ModelErrorKind, ModelManager, ModelStatus};\nuse crate::personalization::PersonalizationService;\nuse crate::settings::{AppSettings, SettingsError, SettingsService};', "ipc service import")
          ipc = replace_once(ipc, '    settings: Arc<SettingsService>,\n    models: Arc<ModelManager>,\n}', '    settings: Arc<SettingsService>,\n    models: Arc<ModelManager>,\n    personalization: PersonalizationService,\n}', "desktop state field")
          ipc = replace_once(ipc, '        let models = Arc::new(ModelManager::new(data_dir).map_err(|error| error.to_string())?);\n        Ok(Self {\n            capture,\n            dictation,\n            insertion,\n            settings,\n            models,\n        })', '        let models = Arc::new(ModelManager::new(data_dir.clone()).map_err(|error| error.to_string())?);\n        let personalization = PersonalizationService::production(data_dir);\n        Ok(Self {\n            capture,\n            dictation,\n            insertion,\n            settings,\n            models,\n            personalization,\n        })', "desktop production personalization")
          ipc = replace_once(ipc, 'impl DesktopState {\n    pub(crate) fn start_configured_dictation(&self) -> Result<SessionSnapshot, CommandErrorDto> {', 'impl DesktopState {\n    pub(crate) fn personalization(&self) -> &PersonalizationService {\n        &self.personalization\n    }\n\n    pub(crate) fn start_configured_dictation(&self) -> Result<SessionSnapshot, CommandErrorDto> {', "desktop personalization accessor")
          ipc = replace_once(ipc, '        let recognition = RecognitionOptions {\n            language_hint: snapshot.language_hint().map(str::to_owned),\n            ..RecognitionOptions::default()\n        };', '        let recognition = RecognitionOptions {\n            language_hint: snapshot.language_hint().map(str::to_owned),\n            initial_prompt: self.personalization.dictionary_prompt().map_err(CommandErrorDto::from)?,\n            ..RecognitionOptions::default()\n        };', "configured dictionary prompt")
          ipc = replace_once(ipc, '        let report = match self\n            .dictation\n            .finish(session_id)\n            .map_err(CommandErrorDto::from)?\n        {', '        let mut report = match self\n            .dictation\n            .finish(session_id)\n            .map_err(CommandErrorDto::from)?\n        {', "mutable finish report")
          ipc = replace_once(ipc, '        let text = report.transcription.capture.transcription.text.clone();\n        self.dictation', '        let original_text = report.transcription.capture.transcription.text.clone();\n        let text = self\n            .personalization\n            .apply_replacements(&original_text)\n            .map_err(CommandErrorDto::from)?;\n        if text != original_text {\n            let transcription = &mut report.transcription.capture.transcription;\n            if transcription.raw_text.is_none() {\n                transcription.raw_text = Some(original_text);\n            }\n            transcription.text = text.clone();\n        }\n        self.dictation', "replacement before insertion")
          ipc = replace_once(ipc, 'impl From<SettingsError> for CommandErrorDto {\n    fn from(error: SettingsError) -> Self {\n        Self::plain("settings_failed", error.message())\n    }\n}\n\nimpl From<ModelError> for CommandErrorDto {', 'impl From<SettingsError> for CommandErrorDto {\n    fn from(error: SettingsError) -> Self {\n        Self::plain("settings_failed", error.message())\n    }\n}\n\nimpl From<PersonalizationError> for CommandErrorDto {\n    fn from(error: PersonalizationError) -> Self {\n        Self::plain("personalization_failed", error.to_string())\n    }\n}\n\nimpl From<ModelError> for CommandErrorDto {', "personalization error mapping")
          ipc_path.write_text(ipc)

          lib_path = Path("apps/desktop/src-tauri/src/lib.rs")
          lib = lib_path.read_text()
          lib = replace_once(lib, 'mod models;\nmod settings;', 'mod models;\nmod personalization;\nmod settings;', "personalization module")
          lib = replace_once(lib, 'use shortcut::{ShortcutService, install_shortcut_backend, shortcut_capability};', 'use personalization::{\n    dictionary_add, dictionary_delete, dictionary_list, personalization_status, replacement_add,\n    replacement_delete, replacement_list,\n};\nuse shortcut::{ShortcutService, install_shortcut_backend, shortcut_capability};', "personalization commands import")
          lib = replace_once(lib, '            history_delete,\n            shortcut_capability,', '            history_delete,\n            personalization_status,\n            dictionary_list,\n            dictionary_add,\n            dictionary_delete,\n            replacement_list,\n            replacement_add,\n            replacement_delete,\n            shortcut_capability,', "personalization command registration")
          lib_path.write_text(lib)

      - name: Refresh lockfile
        run: cargo generate-lockfile

      - name: Format
        run: cargo fmt --all

      - name: Test personalization stack
        run: |
          cargo test -p blcvoice-personalization --locked
          cargo test -p blcvoice-asr --locked
          cargo test -p blcvoice-asr-transcribe --locked
          cargo test -p blcvoice-desktop --lib --locked

      - name: Lint personalization stack
        run: cargo clippy -p blcvoice-personalization -p blcvoice-asr -p blcvoice-asr-transcribe -p blcvoice-desktop --all-targets --locked -- -D warnings

      - name: Commit validated wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock apps/desktop/src-tauri/src/ipc.rs apps/desktop/src-tauri/src/lib.rs
          git rm .github/workflows/apply-personalization-wiring.yml
          git commit -m "feat: wire local dictionary and replacements into dictation"
          git push origin HEAD:feat/v1-history-personalization
