name: Patch shortcut history seam

on:
  push:
    branches:
      - feat/desktop-history-wiring
    paths:
      - .github/workflows/patch-history-coordinator.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/desktop-history-wiring
          persist-credentials: true
      - name: Apply exact coordinator patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/desktop/src-tauri/src/coordinator.rs")
          text = path.read_text()
          import_anchor = "use crate::ipc::{CommandErrorDto, DesktopState, DictationReportDto};\n"
          import_replacement = "use crate::history::{finish_and_record, InvocationOrigin};\n" + import_anchor
          if text.count(import_anchor) != 1:
              raise SystemExit("expected exactly one coordinator import anchor")
          text = text.replace(import_anchor, import_replacement, 1)

          pattern = re.compile(
              r"let result = tauri::async_runtime::spawn_blocking\(move \|\| \{\s*"
              r"worker_app\s*\.state::<DesktopState>\(\)\s*"
              r"\.finish_dictation_session\(session_id\)\s*\}\)\s*\.await;"
          )
          replacement = (
              "let result = tauri::async_runtime::spawn_blocking(move || {\n"
              "            finish_and_record(&worker_app, session_id, InvocationOrigin::Shortcut)\n"
              "        })\n"
              "        .await;"
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"expected exactly one shortcut finish block, found {count}")
          path.write_text(text)
          PY
      - name: Format coordinator
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all
      - name: Commit coordinator patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/coordinator.rs
          git diff --cached --quiet && { echo "No coordinator change produced"; exit 1; }
          git commit -m "feat: persist shortcut dictation history"
          git push origin HEAD:feat/desktop-history-wiring
