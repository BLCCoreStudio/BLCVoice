name: Patch shortcut history seam

on:
  push:
    branches:
      - feat/desktop-history-wiring
    paths:
      - .github/workflows/patch-history-coordinator.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/desktop-history-wiring
          persist-credentials: true
      - name: Apply exact coordinator patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/desktop/src-tauri/src/coordinator.rs")
          text = path.read_text()
          import_anchor = "use crate::ipc::{CommandErrorDto, DesktopState, DictationReportDto};\n"
          import_replacement = (
              "use crate::history::{InvocationOrigin, finish_and_record};\n"
              + import_anchor
          )
          if import_anchor not in text:
              raise SystemExit("expected coordinator import anchor not found")
          text = text.replace(import_anchor, import_replacement, 1)

          old = '''        let result = tauri::async_runtime::spawn_blocking(move || {
            worker_app
                .state::<DesktopState>()
                .finish_dictation_session(session_id)
        })
        .await;
'''
          new = '''        let result = tauri::async_runtime::spawn_blocking(move || {
            finish_and_record(&worker_app, session_id, InvocationOrigin::Shortcut)
        })
        .await;
'''
          if old not in text:
              raise SystemExit("expected shortcut finish block not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Format coordinator
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all
      - name: Commit coordinator patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/coordinator.rs
          git diff --cached --quiet && { echo "No coordinator change produced"; exit 1; }
          git commit -m "feat: persist shortcut dictation history"
          git push origin HEAD:feat/desktop-history-wiring
