# This workflow is temporary and exists only on the feature branch to refresh Cargo.lock after adding workspace path dependencies.
name: Refresh feature lockfile

on:
  push:
    branches:
      - feat/desktop-shortcut-capability

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/desktop-shortcut-capability
          persist-credentials: true
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Refresh lockfile
        run: cargo +1.98.0 metadata --no-deps --format-version 1 > /dev/null
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: refresh Cargo.lock"
          git push origin HEAD:feat/desktop-shortcut-capability
