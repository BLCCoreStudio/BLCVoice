name: Fix history UI typo

on:
  push:
    branches:
      - feat/desktop-history-wiring
    paths:
      - .github/workflows/fix-history-ui-typo.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/desktop-history-wiring
          persist-credentials: true
      - name: Fix exact metadata line
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/ui/app.js')
          text = path.read_text()
          old = '    meta.textContent = `${timestamp} · x${source} · x${language} ·${distoryDeliveryLabel(entry.deliveryState)}`;'
          new = '    meta.textContent = `${timestamp} · ${source} · ${language} · ${historyDeliveryLabel(entry.deliveryState)}`;'
          if text.count(old) != 1:
              raise SystemExit(f'expected one typo line, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check apps/desktop/ui/app.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/ui/app.js
          git commit -m "fix: render history delivery metadata correctly"
          git push origin HEAD:feat/desktop-history-wiring
