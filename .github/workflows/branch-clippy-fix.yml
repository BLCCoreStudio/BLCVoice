name: Branch clippy fix helper

on:
  push:
    branches:
      - feat/linux-runtime-polish-ui
    paths:
      - .github/workflows/branch-clippy-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Scope compatibility helper to stubs and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/blcvoice-insertion-eis/src/lib.rs')
          text = path.read_text()
          old = 'const fn wayland_eis_capability() -> InsertionCapability {'
          new = '#[cfg(any(not(target_os = "linux"), test))]\nconst fn wayland_eis_capability() -> InsertionCapability {'
          if old not in text:
              raise SystemExit('expected helper declaration not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo +1.98.0 fmt --all
      - name: Commit fix
        run: |
          git add crates/blcvoice-insertion-eis/src/lib.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wayland): scope compatibility capability helper"
          git push
