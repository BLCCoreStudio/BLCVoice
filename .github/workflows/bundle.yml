name: Desktop bundles

on:
  pull_request:
    paths:
      - ".github/workflows/bundle.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "apps/desktop/**"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-bundles-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-linux:
    if: github.event_name != 'push'
    name: Bundle validation (Linux x64 / Debian 12)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 60
    env:
      # AppImage build tools are AppImages themselves; containers do not expose
      # FUSE, so use their supported extract-and-run path instead.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Install Debian build prerequisites
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            wget \
            file \
            git \
            build-essential \
            pkg-config \
            nodejs \
            npm \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            patchelf \
            cmake

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Temporary narrow diagnostic for the Debian-12-only release-build failure.
      # Keep the raw compiler/linker output as an artifact, then fail closed before
      # packaging if the production binary itself cannot be built. Remove these
      # three steps once the root cause is fixed and normal bundle validation is green.
      - name: Capture Debian release-build diagnostics
        id: linux-release-preflight
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          "$HOME/.cargo/bin/cargo" +1.98.0 build --locked --release -p blcvoice-desktop 2>&1 | tee linux-release-build.log

      - name: Upload Debian release-build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BLCVoice-linux-x64-debian12-release-build-log
          path: linux-release-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Debian release-build preflight
        if: steps.linux-release-preflight.outcome == 'failure'
        shell: bash
        run: exit 1

      # Keep package formats as separate action steps. A failing AppImage build
      # must not erase evidence that the Debian package itself is healthy, and
      # the failing format remains immediately visible in the job timeline.
      - name: Build and upload Debian validation bundle
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # 1.0.0
        with:
          projectPath: apps/desktop/src-tauri
          args: "--bundles deb"
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "BLCVoice-[platform]-[arch]-[bundle]"
          uploadUpdaterJson: false

      - name: Build and upload AppImage validation bundle
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # 1.0.0
        with:
          projectPath: apps/desktop/src-tauri
          args: "--verbose --bundles appimage"
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "BLCVoice-[platform]-[arch]-[bundle]"
          uploadUpdaterJson: false

  validate-native:
    if: github.event_name != 'push'
    name: Bundle validation (${{ matrix.name }})
    permissions:
      contents: read
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-2025
            args: "--bundles nsis"
          - name: macOS arm64
            platform: macos-15
            args: "--bundles app,dmg"
          - name: macOS x64
            platform: macos-15-intel
            args: "--bundles app,dmg"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure macOS bundle environment
        if: runner.os == 'macOS'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
          echo "CMAKE_ARGS=-DCMAKE_OSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Build and upload validation bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # 1.0.0
        with:
          projectPath: apps/desktop/src-tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "BLCVoice-[platform]-[arch]-[bundle]"
          uploadUpdaterJson: false

  release-linux-draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Draft bundle (Linux x64 / Debian 12)
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 60
    env:
      # Keep release packaging aligned with validation: avoid requiring FUSE
      # inside the Debian container when linuxdeploy/appimagetool execute.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Install Debian build prerequisites
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            wget \
            file \
            git \
            build-essential \
            pkg-config \
            nodejs \
            npm \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            patchelf \
            cmake

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build bundles and create draft prerelease
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # 1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          args: "--bundles deb,appimage"
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "BLCVoice-[platform]-[arch]-[bundle]"
          tagName: ${{ github.ref_name }}
          releaseName: "BLCVoice v__VERSION__"
          releaseBody: "Cross-platform BLCVoice desktop bundles. Windows bundles are unsigned; macOS bundles use ad-hoc signing only and are not Developer ID signed or notarized."
          releaseDraft: true
          prerelease: true
          generateReleaseNotes: true
          uploadUpdaterJson: false

  release-native-draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Draft bundle (${{ matrix.name }})
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-2025
            args: "--bundles nsis"
          - name: macOS arm64
            platform: macos-15
            args: "--bundles app,dmg"
          - name: macOS x64
            platform: macos-15-intel
            args: "--bundles app,dmg"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure macOS bundle environment
        if: runner.os == 'macOS'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
          echo "CMAKE_ARGS=-DCMAKE_OSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Build bundles and create draft prerelease
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # 1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "BLCVoice-[platform]-[arch]-[bundle]"
          tagName: ${{ github.ref_name }}
          releaseName: "BLCVoice v__VERSION__"
          releaseBody: "Cross-platform BLCVoice desktop bundles. Windows bundles are unsigned; macOS bundles use ad-hoc signing only and are not Developer ID signed or notarized."
          releaseDraft: true
          prerelease: true
          generateReleaseNotes: true
          uploadUpdaterJson: false
