# Temporary feature-branch helper. Self-removes after applying the refactor.
name: Prepare insertion capability

on:
  push:
    branches:
      - feat/text-insertion-capability

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/text-insertion-capability
          persist-credentials: true
      - name: Move shortcut environment facts to shared platform crate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/blcvoice-shortcuts/src/lib.rs')
          text = path.read_text()

          text, count = re.subn(
              r'use core::fmt;\n',
              '''use core::fmt;\n\npub use blcvoice_platform::{DesktopPlatform, LinuxDisplayServer, detect_linux_display_server};\nuse blcvoice_platform::{DesktopEnvironment, current_desktop_environment};\n\npub type ShortcutEnvironment = DesktopEnvironment;\n''',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'import insertion replacements: {count}')

          text, count = re.subn(
              r'#\[derive\(Debug, Clone, Copy, PartialEq, Eq\)\]\npub enum DesktopPlatform \{.*?(?=#\[derive\(Debug, Clone, Copy, PartialEq, Eq\)\]\npub enum ShortcutBackend)',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'platform block replacements: {count}')

          text, count = re.subn(
              r'/// Detect the effective Linux display server.*?fn non_empty\(value: Option<&str>\) -> Option<&str> \{\n    value\.map\(str::trim\)\.filter\(\|value\| !value\.is_empty\(\)\)\n\}\n\n',
              '''/// Inspect the current process environment and return the platform facts needed\n/// by the shortcut backend resolver.\n#[must_use]\npub fn current_shortcut_environment() -> ShortcutEnvironment {\n    current_desktop_environment()\n}\n\n''',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'environment function replacements: {count}')

          path.write_text(text)
          PY
      - name: Install Rust tooling
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Format workspace
        run: cargo +1.98.0 fmt --all
      - name: Regenerate lockfile
        run: cargo +1.98.0 generate-lockfile
      - name: Remove helper and commit prepared branch
        run: |
          git rm .github/workflows/prepare-insertion-capability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/blcvoice-shortcuts/src/lib.rs crates/blcvoice-platform crates/blcvoice-insertion
          git diff --cached --quiet && exit 0
          git commit -m "refactor: share platform facts for insertion capability"
          git push origin HEAD:feat/text-insertion-capability
