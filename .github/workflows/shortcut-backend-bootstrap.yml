name: Shortcut backend bootstrap

on:
  push:
    branches:
      - feat/global-shortcut-backends

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Install desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Resolve and compile desktop shortcut backends
        run: cargo +1.98.0 check -p blcvoice-desktop --all-targets
      - name: Format
        run: cargo +1.98.0 fmt --all
      - name: Test desktop shortcut integration
        run: cargo +1.98.0 test --locked -p blcvoice-desktop --all-targets
      - name: Lint desktop shortcut integration
        run: cargo +1.98.0 clippy --locked -p blcvoice-desktop --all-targets -- -D warnings
      - name: Commit generated files
        run: |
          if git diff --quiet -- Cargo.lock apps/desktop/src-tauri/src; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock apps/desktop/src-tauri/src
          git commit -m "chore: normalize shortcut backend integration"
          git push
