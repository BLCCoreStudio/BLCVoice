name: Prepare native insertion branch

on:
  push:
    branches:
      - feat/native-insertion-wiring
    paths:
      - '.github/workflows/_prepare_native_insertion.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/native-insertion-wiring
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libpipewire-0.3-dev libpulse-dev cmake
      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Refresh lockfile and format
        run: |
          cargo +1.98.0 generate-lockfile
          cargo +1.98.0 fmt --all
      - name: Validate changed crates
        run: |
          cargo +1.98.0 test --locked -p blcvoice-insertion-native -p blcvoice-desktop --all-targets
          cargo +1.98.0 clippy --locked -p blcvoice-insertion-native -p blcvoice-desktop --all-targets -- -D warnings
      - name: Remove helper and commit generated changes
        run: |
          rm .github/workflows/_prepare_native_insertion.yml
          git config user.name 'BLC Core Studio — Developer Tools'
          git config user.email '207100624+BLCCoreStudio@users.noreply.github.com'
          git add Cargo.lock Cargo.toml crates apps .github/workflows/_prepare_native_insertion.yml
          if ! git diff --cached --quiet; then
            git commit -m 'chore: finalize native insertion wiring'
            git push origin HEAD:feat/native-insertion-wiring
          fi
