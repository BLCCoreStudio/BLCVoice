# Temporary feature-branch helper. Removed before merge.
name: Fix production dictation clippy

on:
  push:
    branches:
      - feat/production-dictation-service

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/production-dictation-service
          persist-credentials: true
      - name: Apply focused fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          capture = Path('apps/desktop/src-tauri/src/capture.rs')
          text = capture.read_text()
          text, count = re.subn(
              r'    pub fn dictation_insertion_delivered\(.*?\n    }\n\n(?=    fn start_capture)',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'capture insertion method replacements: {count}')
          capture.write_text(text)

          dictation = Path('apps/desktop/src-tauri/src/dictation.rs')
          text = dictation.read_text()
          text, count = re.subn(
              r'    pub fn insertion_delivered\(.*?\n    }\n\n(?=    #\[must_use\]\n    pub fn state_name)',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'dictation insertion method replacements: {count}')
          text, count = re.subn(
              r'        let completed = service\n            \.insertion_delivered\(session\.id\)\n            \.expect\("insertion acknowledgement must complete lifecycle"\);\n        assert_eq!\(completed\.state, blcvoice_core::SessionState::Completed\);\n        assert_eq!\(service\.state_name\(\), "idle"\);',
              '''        let cancelled = service
              .cancel(session.id)
              .expect("pending insertion dictation must remain cancellable");
          assert_eq!(cancelled.state, blcvoice_core::SessionState::Cancelled);
          assert_eq!(service.state_name(), "idle");''',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'dictation insertion test replacements: {count}')
          dictation.write_text(text)

          ipc = Path('apps/desktop/src-tauri/src/ipc.rs')
          text = ipc.read_text()
          text, count = re.subn(
              r'        let mut recognition = RecognitionOptions::default\(\);\n        recognition\.language_hint = language_hint;',
              '''        let recognition = RecognitionOptions {
              language_hint,
              ..RecognitionOptions::default()
          };''',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'RecognitionOptions replacements: {count}')
          ipc.write_text(text)
          PY
      - name: Install Rustfmt
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Format workspace
        run: cargo +1.98.0 fmt --all
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/capture.rs apps/desktop/src-tauri/src/dictation.rs apps/desktop/src-tauri/src/ipc.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: align production dictation with current insertion boundary"
          git push origin HEAD:feat/production-dictation-service
