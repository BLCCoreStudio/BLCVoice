name: Branch lockfile helper

on:
  push:
    branches:
      - feat/linux-runtime-polish-ui
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/blcvoice-insertion-eis/Cargo.toml
      - .github/workflows/branch-lockfile.yml

permissions:
  contents: write

jobs:
  resolve-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Resolve manifest dependencies
        run: cargo check -p blcvoice-insertion-eis
      - name: Commit resolved lockfile
        run: |
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock is already resolved"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: resolve Wayland clipboard lockfile"
          git push
