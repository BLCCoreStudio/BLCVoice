name: Branch lockfile helper

on:
  push:
    branches:
      - feat/linux-runtime-polish-ui
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/blcvoice-insertion-eis/Cargo.toml
      - .github/workflows/branch-lockfile.yml

permissions:
  contents: read

jobs:
  resolve-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Resolve only missing manifest dependencies
        run: cargo check -p blcvoice-insertion-eis
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
