# Temporary feature-branch helper. Self-removes after applying the fix.
name: Fix platform access

on:
  push:
    branches:
      - feat/text-insertion-capability

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/text-insertion-capability
          persist-credentials: true
      - name: Fix shared environment access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/blcvoice-shortcuts/src/lib.rs')
          text = path.read_text()
          old = 'match (environment.platform, environment.linux_display_server) {'
          new = 'match (environment.platform(), environment.linux_display_server()) {'
          if text.count(old) != 1:
              raise SystemExit(f'expected one resolver field access, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install Rustfmt
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Format workspace
        run: cargo +1.98.0 fmt --all
      - name: Remove helper and commit fix
        run: |
          git rm .github/workflows/fix-platform-access.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/blcvoice-shortcuts/src/lib.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: use shared platform accessors"
          git push origin HEAD:feat/text-insertion-capability
