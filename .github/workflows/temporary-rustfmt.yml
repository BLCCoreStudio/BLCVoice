name: Temporary rustfmt

on:
  push:
    branches:
      - feat/v1-dictionary-replacements

permissions:
  contents: write

jobs:
  rustfmt:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply rustfmt') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v1-dictionary-replacements
      - name: Install Rust formatter
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Format workspace
        run: cargo +1.98.0 fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply rustfmt"
          git push origin HEAD:feat/v1-dictionary-replacements
