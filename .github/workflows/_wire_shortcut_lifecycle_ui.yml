name: Wire shortcut lifecycle UI

on:
  push:
    branches:
      - feat/shortcut-lifecycle-ui

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Patch dashboard lifecycle projection
        run: python3 scripts/_wire_shortcut_lifecycle_ui.py
      - name: Validate JavaScript
        run: node --check apps/desktop/ui/app.js
      - name: Commit product change
        run: |
          git config user.name "BLC Core Studio — Developer Tools"
          git config user.email "207100624+BLCCoreStudio@users.noreply.github.com"
          git add apps/desktop/ui/app.js
          git commit -m "feat: mirror shortcut dictation lifecycle in dashboard"
          git push
