name: Generate BLCVoice brand icons

on:
  push:
    branches:
      - feat/v1-branding-linux-integration
    paths:
      - apps/desktop/src-tauri/icons/app-icon.svg
      - .github/workflows/generate-brand-icons.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1-branding-linux-integration
          fetch-depth: 0

      - name: Install icon tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick icnsutils

      - name: Generate platform icon set
        shell: bash
        run: |
          set -euo pipefail
          dir="apps/desktop/src-tauri/icons"
          src="$dir/app-icon.svg"
          tmp="$(mktemp -d)"
          for size in 16 24 32 48 64 128 256 512 1024; do
            rsvg-convert -w "$size" -h "$size" "$src" -o "$tmp/${size}x${size}.png"
          done
          cp "$tmp/32x32.png" "$dir/32x32.png"
          cp "$tmp/128x128.png" "$dir/128x128.png"
          cp "$tmp/256x256.png" "$dir/128x128@2x.png"
          cp "$tmp/512x512.png" "$dir/icon.png"
          convert \
            "$tmp/16x16.png" "$tmp/24x24.png" "$tmp/32x32.png" \
            "$tmp/48x48.png" "$tmp/64x64.png" "$tmp/128x128.png" "$tmp/256x256.png" \
            "$dir/icon.ico"
          png2icns "$dir/icon.icns" \
            "$tmp/16x16.png" "$tmp/32x32.png" "$tmp/128x128.png" \
            "$tmp/256x256.png" "$tmp/512x512.png" "$tmp/1024x1024.png"

      - name: Commit generated icons and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/icons/32x32.png \
                  apps/desktop/src-tauri/icons/128x128.png \
                  apps/desktop/src-tauri/icons/128x128@2x.png \
                  apps/desktop/src-tauri/icons/icon.png \
                  apps/desktop/src-tauri/icons/icon.ico \
                  apps/desktop/src-tauri/icons/icon.icns
          git rm .github/workflows/generate-brand-icons.yml
          git commit -m "brand: generate BLCVoice platform icon set"
          git push origin HEAD:feat/v1-branding-linux-integration
