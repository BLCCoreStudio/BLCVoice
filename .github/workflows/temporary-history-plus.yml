name: Temporary History Plus Patch

on:
  push:
    branches:
      - feat/v1-history-plus

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'feat: apply history plus UI') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v1-history-plus
      - name: Apply deterministic History+ UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('apps/desktop/ui/app.js')
          text = app.read_text()

          old = '''  refreshHistory: document.getElementById("refresh-history"),
            historyMessage: document.getElementById("history-message"),
            historyList: document.getElementById("history-list"),
            historyBackend: document.getElementById("history-backend"),
            historyDetail: document.getElementById("history-detail"),
          };'''.replace('            ', '  ')
          new = '''  refreshHistory: document.getElementById("refresh-history"),
          historySearch: document.getElementById("history-search"),
          historyFilter: document.getElementById("history-filter"),
          historyMessage: document.getElementById("history-message"),
          historyList: document.getElementById("history-list"),
          historyBackend: document.getElementById("history-backend"),
          historyDetail: document.getElementById("history-detail"),
          };'''.replace('          ', '  ')
          if old not in text:
              raise SystemExit('elements history block not found')
          text = text.replace(old, new, 1)

          old = '''  shortcutSessionActive: false,
            historyBusy: false,
          };'''.replace('            ', '  ')
          new = '''  shortcutSessionActive: false,
          historyBusy: false,
          historyEntries: [],
          };'''.replace('          ', '  ')
          if old not in text:
              raise SystemExit('history state block not found')
          text = text.replace(old, new, 1)

          start = text.index('function historyDeliveryLabel(stateName) {')
          end = text.index('async function refreshDiagnostics() {')
          history_impl = r'''function historyDeliveryLabel(stateName) {
            switch (stateName) {
              case "deliveredVerified": return "Delivery verified";
              case "backendSubmittedUnverified": return "Submitted";
              case "insertionFailed": return "Insertion failed";
              case "transcribedOnly": return "Transcribed only";
              default: return stateName || "Unknown state";
            }
          }

          function historyDeliveryKind(stateName) {
            switch (stateName) {
              case "deliveredVerified": return "success";
              case "backendSubmittedUnverified": return "submitted";
              case "insertionFailed": return "failed";
              default: return "neutral";
            }
          }

          function startOfLocalDay(date) {
            return new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
          }

          function historyGroupLabel(timestampMs) {
            const timestamp = new Date(timestampMs);
            const now = new Date();
            const todayStart = startOfLocalDay(now);
            const dayStart = startOfLocalDay(timestamp);
            const deltaDays = Math.round((todayStart - dayStart) / 86_400_000);
            if (deltaDays === 0) return "Today";
            if (deltaDays === 1) return "Yesterday";
            return timestamp.toLocaleDateString(undefined, {
              weekday: "short",
              year: timestamp.getFullYear() === now.getFullYear() ? undefined : "numeric",
              month: "short",
              day: "numeric",
            });
          }

          function matchesHistoryFilter(entry) {
            const filter = elements.historyFilter?.value || "all";
            if (filter === "failed") return entry.deliveryState === "insertionFailed";
            if (filter === "submitted") {
              return entry.deliveryState === "backendSubmittedUnverified" || entry.deliveryState === "deliveredVerified";
            }
            if (filter === "shortcut") return entry.invocationSource === "shortcut";
            if (filter === "desktop") return entry.invocationSource === "desktopUi";
            return true;
          }

          function visibleHistoryEntries() {
            const query = (elements.historySearch?.value || "").trim().toLocaleLowerCase();
            return state.historyEntries.filter((entry) => {
              if (!matchesHistoryFilter(entry)) return false;
              if (!query) return true;
              return [
                entry.transcript,
                entry.detectedLanguage,
                entry.modelId,
                entry.engineId,
                entry.insertionBackend,
              ].filter(Boolean).some((value) => String(value).toLocaleLowerCase().includes(query));
            });
          }

          async function copyHistoryText(button, text) {
            try {
              await navigator.clipboard.writeText(text);
              const previous = button.textContent;
              button.textContent = "Copied";
              window.setTimeout(() => { button.textContent = previous; }, 1100);
            } catch {
              button.textContent = "Copy unavailable";
            }
          }

          function createHistoryAction(label, className, action) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = className;
            button.textContent = label;
            button.addEventListener("click", action);
            return button;
          }

          function renderHistory() {
            elements.historyList.replaceChildren();
            const entries = visibleHistoryEntries();
            if (!state.historyEntries.length) {
              elements.historyMessage.textContent = "No local transcripts yet.";
              return;
            }
            elements.historyMessage.textContent = entries.length === state.historyEntries.length
              ? `${entries.length} recent local transcript${entries.length === 1 ? "" : "s"}.`
              : `${entries.length} of ${state.historyEntries.length} transcripts match.`;
            if (!entries.length) {
              const empty = document.createElement("p");
              empty.className = "history-empty";
              empty.textContent = "No transcripts match this search or filter.";
              elements.historyList.append(empty);
              return;
            }

            let activeGroup = null;
            let groupList = null;
            for (const entry of entries) {
              const group = historyGroupLabel(entry.createdAtUnixMs);
              if (group !== activeGroup) {
                activeGroup = group;
                const section = document.createElement("section");
                section.className = "history-group";
                const heading = document.createElement("h2");
                heading.className = "history-group-heading";
                heading.textContent = group;
                groupList = document.createElement("div");
                groupList.className = "history-group-list";
                section.append(heading, groupList);
                elements.historyList.append(section);
              }

              const card = document.createElement("article");
              card.className = "history-item history-item-plus";
              const transcript = document.createElement("p");
              transcript.className = "history-transcript";
              transcript.textContent = entry.transcript;
              card.append(transcript);

              const summary = document.createElement("div");
              summary.className = "history-summary";
              const timestamp = document.createElement("span");
              timestamp.textContent = new Date(entry.createdAtUnixMs).toLocaleTimeString(undefined, {
                hour: "2-digit", minute: "2-digit",
              });
              const source = document.createElement("span");
              source.textContent = entry.invocationSource === "shortcut" ? "Shortcut" : "Desktop UI";
              const language = document.createElement("span");
              language.textContent = entry.detectedLanguage ? entry.detectedLanguage.toUpperCase() : "Language unknown";
              const delivery = document.createElement("span");
              delivery.className = `history-delivery ${historyDeliveryKind(entry.deliveryState)}`;
              delivery.textContent = historyDeliveryLabel(entry.deliveryState);
              summary.append(timestamp, source, language, delivery);
              card.append(summary);

              const details = document.createElement("details");
              details.className = "history-details";
              const detailSummary = document.createElement("summary");
              detailSummary.textContent = "Details";
              const metadata = document.createElement("dl");
              const rows = [
                ["Model", entry.modelId || "Unknown"],
                ["Engine", entry.engineId || "Unknown"],
                ["Insertion", entry.insertionBackend || "Not recorded"],
                ["Source", entry.invocationSource === "shortcut" ? "Global shortcut" : "Desktop UI"],
              ];
              for (const [label, value] of rows) {
                const row = document.createElement("div");
                const dt = document.createElement("dt");
                const dd = document.createElement("dd");
                dt.textContent = label;
                dd.textContent = value;
                row.append(dt, dd);
                metadata.append(row);
              }
              details.append(detailSummary, metadata);
              card.append(details);

              const actions = document.createElement("div");
              actions.className = "history-actions";
              actions.append(createHistoryAction("Copy", "button secondary compact", (event) => {
                void copyHistoryText(event.currentTarget, entry.transcript);
              }));
              const remove = createHistoryAction("Delete", "button danger compact", async () => {
                if (state.historyBusy) return;
                state.historyBusy = true;
                remove.disabled = true;
                try {
                  await invoke("history_delete", { id: entry.id });
                  state.historyBusy = false;
                  await refreshHistory();
                } catch (error) {
                  elements.historyMessage.textContent = commandErrorMessage(error);
                } finally {
                  state.historyBusy = false;
                }
              });
              actions.append(remove);
              card.append(actions);
              groupList.append(card);
            }
          }

          async function refreshHistory() {
            if (!invoke || state.historyBusy) return;
            elements.refreshHistory.disabled = true;
            try {
              const health = await invoke("history_status");
              elements.historyBackend.textContent = health.available ? "Available" : "Unavailable";
              elements.historyDetail.textContent = health.lastError || health.databasePath || "Local SQLite history";
              if (!health.available) {
                state.historyEntries = [];
                elements.historyList.replaceChildren();
                elements.historyMessage.textContent = health.lastError || "Local history is unavailable. Dictation remains available.";
                return;
              }
              const entries = await invoke("history_list", { limit: 500 });
              state.historyEntries = Array.isArray(entries) ? entries : [];
              renderHistory();
            } catch (error) {
              const message = commandErrorMessage(error);
              state.historyEntries = [];
              elements.historyBackend.textContent = "Unavailable";
              elements.historyDetail.textContent = message;
              elements.historyList.replaceChildren();
              elements.historyMessage.textContent = message;
            } finally {
              elements.refreshHistory.disabled = false;
            }
          }

          '''.replace('          ', '')
          text = text[:start] + history_impl + text[end:]

          old = 'elements.refreshHistory.addEventListener("click", () => void refreshHistory());\n'
          new = '''elements.refreshHistory.addEventListener("click", () => void refreshHistory());
          elements.historySearch?.addEventListener("input", renderHistory);
          elements.historyFilter?.addEventListener("change", renderHistory);
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit('history listener insertion point not found')
          text = text.replace(old, new, 1)
          app.write_text(text)

          index = Path('apps/desktop/ui/index.html')
          html = index.read_text()
          css_link = '    <link rel="stylesheet" href="lexicon.css" />\n'
          if css_link not in html:
              raise SystemExit('lexicon css link not found')
          html = html.replace(css_link, css_link + '    <link rel="stylesheet" href="history-plus.css" />\n', 1)
          marker = '''          <section class="panel feature-panel">
            <p class="panel-copy">BLCVoice stores transcript text and delivery metadata in your private app-data directory. Microphone audio, PCM and VAD buffers are never kept in history.</p>'''
          replacement = '''          <div class="history-toolbar">
            <label class="history-search-wrap">
              <span class="sr-only">Search transcripts</span>
              <input id="history-search" type="search" placeholder="Search transcripts, model or language…" autocomplete="off" />
            </label>
            <select id="history-filter" aria-label="Filter transcript history">
              <option value="all">All transcripts</option>
              <option value="submitted">Submitted</option>
              <option value="failed">Insertion failed</option>
              <option value="shortcut">Shortcut</option>
              <option value="desktop">Desktop UI</option>
            </select>
          </div>
          <section class="panel feature-panel">
            <p class="panel-copy">BLCVoice stores transcript text and delivery metadata in your private app-data directory. Microphone audio, PCM and VAD buffers are never kept in history.</p>'''
          if marker not in html:
              raise SystemExit('history panel marker not found')
          html = html.replace(marker, replacement, 1)
          index.write_text(html)

          Path('apps/desktop/ui/history-plus.css').write_text(r'''.history-toolbar {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 190px;
            gap: 10px;
            margin-bottom: 14px;
          }
          .history-toolbar input,
          .history-toolbar select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 10px;
            color: inherit;
            background: rgba(255,255,255,.035);
            font: inherit;
          }
          .history-toolbar input:focus,
          .history-toolbar select:focus { outline: 2px solid rgba(137,122,255,.45); outline-offset: 1px; }
          .history-list { display: grid; gap: 18px; }
          .history-group { display: grid; gap: 8px; }
          .history-group-heading { margin: 0; color: #b4b4bb; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; }
          .history-group-list { display: grid; gap: 8px; }
          .history-item-plus { display: grid; gap: 10px; }
          .history-transcript { margin: 0; font-size: .95rem; line-height: 1.5; white-space: pre-wrap; }
          .history-summary { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; color: #9999a1; font-size: .68rem; }
          .history-delivery { padding: 3px 7px; border-radius: 999px; border: 1px solid rgba(255,255,255,.08); }
          .history-delivery.success { color: #66dca2; border-color: rgba(74,210,146,.24); background: rgba(74,210,146,.07); }
          .history-delivery.submitted { color: #a9a0ff; border-color: rgba(145,128,255,.24); background: rgba(145,128,255,.07); }
          .history-delivery.failed { color: #ff8a8a; border-color: rgba(255,112,112,.24); background: rgba(255,112,112,.07); }
          .history-details { color: #a5a5ad; font-size: .72rem; }
          .history-details summary { width: max-content; cursor: pointer; user-select: none; }
          .history-details dl { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; margin: 10px 0 0; }
          .history-details dl div { min-width: 0; padding: 8px 9px; border-radius: 8px; background: rgba(255,255,255,.025); }
          .history-details dt { color: #85858d; font-size: .62rem; text-transform: uppercase; letter-spacing: .06em; }
          .history-details dd { margin: 3px 0 0; color: #c6c6cc; overflow-wrap: anywhere; }
          .history-actions { display: flex; gap: 7px; align-items: center; }
          .history-empty { margin: 0; padding: 20px; border: 1px dashed rgba(255,255,255,.09); border-radius: 11px; color: #9999a1; text-align: center; }
          .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
          @media (max-width: 760px) { .history-toolbar { grid-template-columns: 1fr; } .history-details dl { grid-template-columns: 1fr; } }
          ''')

          helper = Path('.github/workflows/temporary-history-plus.yml')
          trigger = Path('.history-plus-trigger')
          if helper.exists(): helper.unlink()
          if trigger.exists(): trigger.unlink()
          PY
          node --check apps/desktop/ui/app.js
      - name: Commit History+ UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply history plus UI"
          git push origin HEAD:feat/v1-history-plus
