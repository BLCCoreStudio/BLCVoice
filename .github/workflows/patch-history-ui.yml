name: Patch history UI behavior

on:
  push:
    branches:
      - feat/desktop-history-wiring
    paths:
      - .github/workflows/patch-history-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/desktop-history-wiring
          persist-credentials: true
      - name: Apply fail-closed UI patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("apps/desktop/ui/app.js")
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one {label}, found {text.count(old)}")
              text = text.replace(old, new, 1)

          replace_once(
              '  recognizerBackend: document.getElementById("recognizer-backend"),\n',
              '  recognizerBackend: document.getElementById("recognizer-backend"),\n'
              '  refreshHistory: document.getElementById("refresh-history"),\n'
              '  historyMessage: document.getElementById("history-message"),\n'
              '  historyList: document.getElementById("history-list"),\n'
              '  historyBackend: document.getElementById("history-backend"),\n'
              '  historyDetail: document.getElementById("history-detail"),\n',
              "element anchor",
          )
          replace_once(
              '  shortcutSessionActive: false,\n',
              '  shortcutSessionActive: false,\n  historyBusy: false,\n',
              "state anchor",
          )
          replace_once(
              '  } finally {\n    state.dictationBusy = false;\n    updateDictationControls();\n  }\n}\n\nasync function cancelDictation()',
              '  } finally {\n    state.dictationBusy = false;\n    updateDictationControls();\n    await refreshHistory();\n  }\n}\n\nasync function cancelDictation()',
              "finish history refresh",
          )

          history_functions = r'''
function historyDeliveryLabel(stateName) {
  switch (stateName) {
    case "deliveredVerified": return "delivery verified";
    case "backendSubmittedUnverified": return "submitted · verification unavailable";
    case "insertionFailed": return "insertion failed · text recovered";
    case "transcribedOnly": return "transcribed only";
    default: return stateName || "unknown state";
  }
}

function renderHistory(entries) {
  elements.historyList.replaceChildren();
  if (!entries.length) {
    elements.historyMessage.textContent = "No local transcripts yet.";
    return;
  }
  elements.historyMessage.textContent = `${entries.length} recent local transcript${entries.length === 1 ? "" : "s"}.`;
  for (const entry of entries) {
    const card = document.createElement("article");
    card.className = "history-item";
    const transcript = document.createElement("p");
    transcript.textContent = entry.transcript;
    card.append(transcript);

    const footer = document.createElement("div");
    footer.className = "history-item-footer";
    const meta = document.createElement("div");
    meta.className = "history-meta";
    const timestamp = new Date(entry.createdAtUnixMs).toLocaleString();
    const source = entry.invocationSource === "shortcut" ? "Shortcut" : "Desktop UI";
    const language = entry.detectedLanguage ? entry.detectedLanguage.toUpperCase() : "language unknown";
    meta.textContent = `${timestamp} · ${source} · ${language} · ${historyDeliveryLabel(entry.deliveryState)}`;
    footer.append(meta);

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "button danger compact history-delete";
    remove.textContent = "Delete";
    remove.addEventListener("click", async () => {
      if (state.historyBusy) return;
      state.historyBusy = true;
      remove.disabled = true;
      try {
        await invoke("history_delete", { id: entry.id });
        await refreshHistory();
      } catch (error) {
        elements.historyMessage.textContent = commandErrorMessage(error);
      } finally {
        state.historyBusy = false;
      }
    });
    footer.append(remove);
    card.append(footer);
    elements.historyList.append(card);
  }
}

async function refreshHistory() {
  if (!invoke || state.historyBusy) return;
  elements.refreshHistory.disabled = true;
  try {
    const health = await invoke("history_status");
    elements.historyBackend.textContent = health.available ? "Available" : "Unavailable";
    elements.historyDetail.textContent = health.lastError || health.databasePath || "Local SQLite history";
    if (!health.available) {
      elements.historyList.replaceChildren();
      elements.historyMessage.textContent = health.lastError || "Local history is unavailable. Dictation remains available.";
      return;
    }
    const entries = await invoke("history_list", { limit: 100 });
    renderHistory(Array.isArray(entries) ? entries : []);
  } catch (error) {
    const message = commandErrorMessage(error);
    elements.historyBackend.textContent = "Unavailable";
    elements.historyDetail.textContent = message;
    elements.historyList.replaceChildren();
    elements.historyMessage.textContent = message;
  } finally {
    elements.refreshHistory.disabled = false;
  }
}

'''
          replace_once(
              'async function refreshDiagnostics() {\n',
              history_functions + 'async function refreshDiagnostics() {\n',
              "diagnostics function anchor",
          )
          replace_once(
              '  updateDictationControls();\n}\n\nasync function subscribeShortcutLifecycle()',
              '  if (payload.state === "completed" || payload.state === "failed") void refreshHistory();\n  updateDictationControls();\n}\n\nasync function subscribeShortcutLifecycle()',
              "shortcut terminal refresh anchor",
          )
          replace_once(
              '    await Promise.all([refreshDevices(), refreshModels(), refreshDiagnostics(), recoverDesktopStatus()]);\n',
              '    await Promise.all([refreshDevices(), refreshModels(), refreshDiagnostics(), refreshHistory(), recoverDesktopStatus()]);\n',
              "bootstrap refresh anchor",
          )
          replace_once(
              'elements.refreshDiagnostics.addEventListener("click", () => void refreshDiagnostics());\n',
              'elements.refreshDiagnostics.addEventListener("click", () => void refreshDiagnostics());\n'
              'elements.refreshHistory.addEventListener("click", () => void refreshHistory());\n',
              "listener anchor",
          )
          path.write_text(text)
          PY
      - name: Validate JavaScript
        run: node --check apps/desktop/ui/app.js
      - name: Commit UI behavior
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/ui/app.js
          git diff --cached --quiet && { echo "No UI change produced"; exit 1; }
          git commit -m "feat: render and manage local transcript history"
          git push origin HEAD:feat/desktop-history-wiring
