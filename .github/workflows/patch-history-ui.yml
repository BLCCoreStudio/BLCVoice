name: Patch history UI behavior

on:
  push:
    branches:
      - feat/desktop-history-wiring
    paths:
      - .github/workflows/patch-history-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/desktop-history-wiring
          persist-credentials: true
      - name: Apply fail-closed UI patch
        shell: bash
        env:
          HISTORY_FUNCTIONS_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("apps/desktop/ui/app.js")
          text = path.read_text()

          def replace_once(old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one {label}, found {count}")
              return text.replace(old, new, 1)

          text = replace_once('  recognizerBackend: document.getElementById("recognizer-backend"),\n', '  recognizerBackend: document.getElementById("recognizer-backend"),\n  refreshHistory: document.getElementById("refresh-history"),\n  historyMessage: document.getElementById("history-message"),\n  historyList: document.getElementById("history-list"),\n  historyBackend: document.getElementById("history-backend"),\n  historyDetail: document.getElementById("history-detail"),\n', "element anchor")
          text = replace_once('  shortcutSessionActive: false,\n', '  shortcutSessionActive: false,\n  historyBusy: false,\n', "state anchor")
          text = replace_once('  } finally {\n    state.dictationBusy = false;\n    updateDictationControls();\n  }\n}\n\nasync function cancelDictation()', '  } finally {\n    state.dictationBusy = false;\n    updateDictationControls();\n    await refreshHistory();\n  }\n}\n\nasync function cancelDictation()', "finish history refresh")
          history_functions = base64.b64decode(os.environ["HISTORY_FUNCTIONS_B64"]).decode()
          text = replace_once('async function refreshDiagnostics() {\n', history_functions + 'async function refreshDiagnostics() {\n', "diagnostics anchor")
          text = replace_once('  updateDictationControls();\n}\n\nasync function subscribeShortcutLifecycle()', '  if (payload.state === "completed" || payload.state === "failed") void refreshHistory();\n  updateDictationControls();\n}\n\nasync function subscribeShortcutLifecycle()', "shortcut refresh anchor")
          text = replace_once('    await Promise.all([refreshDevices(), refreshModels(), refreshDiagnostics(), recoverDesktopStatus()]);\n', '    await Promise.all([refreshDevices(), refreshModels(), refreshDiagnostics(), refreshHistory(), recoverDesktopStatus()]);\n', "bootstrap anchor")
          text = replace_once('elements.refreshDiagnostics.addEventListener("click", () => void refreshDiagnostics());\n', 'elements.refreshDiagnostics.addEventListener("click", () => void refreshDiagnostics());\nelements.refreshHistory.addEventListener("click", () => void refreshHistory());\n', "listener anchor")
          path.write_text(text)
          PY
      - name: Validate JavaScript
        run: node --check apps/desktop/ui/app.js
      - name: Commit UI behavior
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/ui/app.js
          git diff --cached --quiet && { echo "No UI change produced"; exit 1; }
          git commit -m "feat: render and manage local transcript history"
          git push origin HEAD:feat/desktop-history-wiring
