name: Validate production VAD integration

on:
  push:
    branches:
      - feat/production-vad-integration-build

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libpipewire-0.3-dev libpulse-dev
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Integrate production VAD policy
        run: |
          python3 scripts/_integrate_production_vad.py
          python3 scripts/_fix_production_vad_compile.py
      - name: Format and validate
        run: |
          cargo +1.98.0 fmt --all
          node --check apps/desktop/ui/app.js
          cargo +1.98.0 test -p blcvoice-dictation -p blcvoice-runtime -p blcvoice-desktop --all-targets
          cargo +1.98.0 clippy -p blcvoice-dictation -p blcvoice-runtime -p blcvoice-desktop --all-targets -- -D warnings
      - name: Commit validated product changes
        run: |
          git config user.name "BLC Core Studio — Developer Tools"
          git config user.email "207100624+BLCCoreStudio@users.noreply.github.com"
          git add Cargo.lock crates/blcvoice-dictation/Cargo.toml crates/blcvoice-dictation/src/lib.rs crates/blcvoice-runtime/Cargo.toml crates/blcvoice-runtime/src/lib.rs apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/src/capture.rs apps/desktop/src-tauri/src/dictation.rs apps/desktop/src-tauri/src/ipc.rs apps/desktop/src-tauri/src/coordinator.rs apps/desktop/ui/app.js docs/adr/0025-production-vad-policy.md
          git commit -m "feat: integrate speech detection into production dictation"
          git push
