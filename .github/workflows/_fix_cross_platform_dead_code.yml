name: Fix cross-platform insertion lints
on:
  push:
    branches: [feat/native-insertion-wiring]
    paths: ['.github/workflows/_fix_cross_platform_dead_code.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/native-insertion-wiring
      - name: Gate Linux-only helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/blcvoice-insertion-eis/src/lib.rs')
          s=p.read_text()
          s=s.replace('const EI_TEXT_MAX_UTF8_BYTES: usize = 254;', '#[cfg(any(target_os = "linux", test))]\nconst EI_TEXT_MAX_UTF8_BYTES: usize = 254;')
          s=s.replace('fn utf8_chunks(mut text: &str)', '#[cfg(any(target_os = "linux", test))]\nfn utf8_chunks(mut text: &str)')
          p.write_text(s)
          p=Path('crates/blcvoice-insertion-x11/src/lib.rs')
          s=p.read_text()
          for old in [
            'const XK_RETURN: u32 = 0xFF0D;',
            'const XK_TAB: u32 = 0xFF09;',
            'const UNICODE_KEYSYM_PREFIX: u32 = 0x0100_0000;',
          ]:
            s=s.replace(old, '#[cfg(any(target_os = "linux", test))]\n'+old)
          s=s.replace('fn char_to_keysym(character: char)', '#[cfg(any(target_os = "linux", test))]\nfn char_to_keysym(character: char)')
          s=s.replace('fn find_scratch_keycode(\n', '#[cfg(any(target_os = "linux", test))]\nfn find_scratch_keycode(\n')
          p.write_text(s)
          PY
      - name: Format
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all
      - name: Commit
        run: |
          rm .github/workflows/_fix_cross_platform_dead_code.yml
          git config user.name 'BLC Core Studio — Developer Tools'
          git config user.email '207100624+BLCCoreStudio@users.noreply.github.com'
          git add crates .github/workflows/_fix_cross_platform_dead_code.yml
          git commit -m 'fix: gate platform-specific insertion helpers'
          git push origin HEAD:feat/native-insertion-wiring
