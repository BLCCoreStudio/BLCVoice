# Temporary feature-branch helper. Removed before merge.
name: Format production dictation branch

on:
  push:
    branches:
      - feat/production-dictation-service

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/production-dictation-service
          persist-credentials: true
      - name: Install Rustfmt
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Format workspace
        run: cargo +1.98.0 fmt --all
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/capture.rs apps/desktop/src-tauri/src/dictation.rs apps/desktop/src-tauri/src/ipc.rs
          git diff --cached --quiet && exit 0
          git commit -m "style: format production dictation service"
          git push origin HEAD:feat/production-dictation-service
