name: Fix history delete refresh

on:
  push:
    branches:
      - feat/desktop-history-wiring
    paths:
      - .github/workflows/fix-history-delete-refresh.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/desktop-history-wiring
          persist-credentials: true
      - name: Fix exact delete refresh block
        run: python3 -c "from pathlib import Path; p=Path('apps/desktop/ui/app.js'); t=p.read_text(); old='        await invoke(\"history_delete\", { id: entry.id });\\n        await refreshHistory();'; new='        await invoke(\"history_delete\", { id: entry.id });\\n        state.historyBusy = false;\\n        await refreshHistory();'; assert t.count(old) == 1, t.count(old); p.write_text(t.replace(old, new, 1))"
      - name: Validate JavaScript
        run: node --check apps/desktop/ui/app.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/ui/app.js
          git commit -m "fix: refresh history after explicit deletion"
          git push origin HEAD:feat/desktop-history-wiring
