name: Temporary lockfile resolver

on:
  pull_request:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Resolve and print Cargo.lock
        shell: bash
        run: |
          cargo +1.98.0 generate-lockfile
          echo 'BLCVOICE_LOCK_BEGIN'
          base64 -w0 Cargo.lock
          echo
          echo 'BLCVOICE_LOCK_END'
