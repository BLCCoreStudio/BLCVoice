name: One-shot rustls lock refresh

on:
  push:
    branches:
      - feat/linux-runtime-polish-ui
    paths:
      - .github/workflows/one-shot-rustls-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/linux-runtime-polish-ui
          fetch-depth: 0

      - name: Update rustls to patched release
        run: cargo update -p rustls --precise 0.23.45

      - name: Verify patched lockfile
        run: |
          cargo tree -i rustls
          grep -A3 '^name = "rustls"$' Cargo.lock | grep 'version = "0.23.45"'

      - name: Commit lockfile and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git rm .github/workflows/one-shot-rustls-lock-refresh.yml
          git commit -m "fix(security): update rustls to 0.23.45"
          git push origin HEAD:feat/linux-runtime-polish-ui
