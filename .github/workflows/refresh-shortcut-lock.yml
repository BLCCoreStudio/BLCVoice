# Temporary feature-branch helper. This file is removed before the PR is opened.
name: Refresh shortcut feature lockfile

on:
  push:
    branches:
      - feat/global-shortcut-registration

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/global-shortcut-registration
          persist-credentials: true
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Refresh lockfile
        run: cargo +1.98.0 generate-lockfile
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: refresh Cargo.lock for shortcut backends"
          git push origin HEAD:feat/global-shortcut-registration
