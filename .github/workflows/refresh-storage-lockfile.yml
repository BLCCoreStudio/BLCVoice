name: Refresh storage lockfile

on:
  push:
    branches:
      - feat/local-history-storage-impl
    paths:
      - .github/workflows/refresh-storage-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/local-history-storage-impl
          persist-credentials: true
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Generate lockfile and format
        run: |
          cargo +1.98.0 generate-lockfile
          cargo +1.98.0 fmt --all
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/blcvoice-storage/src/lib.rs
          if git diff --cached --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git commit -m "chore: refresh storage dependency lockfile"
          git push origin HEAD:feat/local-history-storage-impl
