name: Prepare Wayland EIS adapter

on:
  push:
    branches:
      - feat/wayland-eis-insertion

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/wayland-eis-insertion
          persist-credentials: true
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Apply compile fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("crates/blcvoice-insertion-eis/src/lib.rs")
          text = path.read_text()
          text = text.replace(
              ".set_devices(PortalDeviceType::Keyboard)",
              ".set_devices(enumflags2::BitFlags::from_flag(PortalDeviceType::Keyboard))",
          )

          readiness_pattern = re.compile(
              r"let event = events\.next\(\)\.await\.ok_or_else\(\|\| \{\s*"
              r"InsertionError::new\(\s*InsertionErrorKind::BackendUnavailable,\s*"
              r'"the EIS event stream closed before a text device became available",\s*'
              r"\)\s*\}\)\?\?;"
          )
          text, readiness_count = readiness_pattern.subn(
              '''let event = events
                    .next()
                    .await
                    .ok_or_else(|| {
                        InsertionError::new(
                            InsertionErrorKind::BackendUnavailable,
                            "the EIS event stream closed before a text device became available",
                        )
                    })?
                    .map_err(|error| {
                        backend_failure(format!("failed to read an EIS readiness event: {error}"))
                    })?;''',
              text,
              count=1,
          )
          if readiness_count != 1:
              raise SystemExit(f"expected one readiness block, found {readiness_count}")

          live_pattern = re.compile(
              r"let event = event\.ok_or_else\(\|\| \{\s*"
              r"InsertionError::new\(\s*InsertionErrorKind::BackendUnavailable,\s*"
              r'"the EIS event stream closed",\s*\)\s*\}\)\?\?;'
          )
          text, live_count = live_pattern.subn(
              '''let event = event
                        .ok_or_else(|| {
                            InsertionError::new(
                                InsertionErrorKind::BackendUnavailable,
                                "the EIS event stream closed",
                            )
                        })?
                        .map_err(|error| {
                            backend_failure(format!("failed to read an EIS event: {error}"))
                        })?;''',
              text,
              count=1,
          )
          if live_count != 1:
              raise SystemExit(f"expected one live event block, found {live_count}")

          path.write_text(text)
          PY
      - name: Regenerate lockfile
        run: cargo +1.98.0 generate-lockfile
      - name: Format workspace
        run: cargo +1.98.0 fmt --all
      - name: Check EIS adapter
        run: cargo +1.98.0 check -p blcvoice-insertion-eis --all-targets
      - name: Lint EIS adapter
        run: cargo +1.98.0 clippy -p blcvoice-insertion-eis --all-targets -- -D warnings
      - name: Remove helper and commit generated files
        shell: bash
        run: |
          rm .github/workflows/zz-wayland-eis-prepare.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: prepare Wayland EIS adapter"
          git push origin HEAD:feat/wayland-eis-insertion
