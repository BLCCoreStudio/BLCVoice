name: Lockfile bootstrap

on:
  push:
    branches:
      - feat/realtime-audio-capture

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/realtime-audio-capture
          persist-credentials: true
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Refresh Cargo.lock when required
        run: |
          cargo +1.98.0 generate-lockfile
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: lock realtime capture dependency"
          git push origin HEAD:feat/realtime-audio-capture
