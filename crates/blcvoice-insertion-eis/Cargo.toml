[package]
name = "blcvoice-insertion-eis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Wayland XDG RemoteDesktop/libei text insertion adapter for BLCVoice"

[dependencies]
blcvoice-insertion = { path = "../blcvoice-insertion" }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["remote_desktop", "tokio"] }
futures-util = "0.3"
reis = { version = "0.7.1", features = ["tokio"] }
rustix = { version = "1", features = ["time"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }

[lints]
workspace = true
