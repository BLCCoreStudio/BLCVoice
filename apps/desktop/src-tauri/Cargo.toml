[package]
name = "blcvoice-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native desktop shell for BLCVoice"

[lib]
name = "blcvoice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "blcvoice"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
blcvoice-asr = { path = "../../../crates/blcvoice-asr" }
blcvoice-asr-transcribe = { path = "../../../crates/blcvoice-asr-transcribe" }
blcvoice-audio = { path = "../../../crates/blcvoice-audio" }
blcvoice-audio-cpal = { path = "../../../crates/blcvoice-audio-cpal" }
blcvoice-core = { path = "../../../crates/blcvoice-core" }
blcvoice-insertion = { path = "../../../crates/blcvoice-insertion" }
blcvoice-insertion-eis = { path = "../../../crates/blcvoice-insertion-eis" }
blcvoice-insertion-native = { path = "../../../crates/blcvoice-insertion-native" }
blcvoice-insertion-x11 = { path = "../../../crates/blcvoice-insertion-x11" }
blcvoice-platform = { path = "../../../crates/blcvoice-platform" }
blcvoice-runtime = { path = "../../../crates/blcvoice-runtime" }
blcvoice-shortcuts = { path = "../../../crates/blcvoice-shortcuts" }
reqwest = { version = "0.13.4", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["global_shortcuts", "tokio"] }
futures-util = "0.3"

[lints]
workspace = true
