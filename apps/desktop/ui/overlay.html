<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLCVoice Dictation</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <main id="overlay-shell" class="overlay-shell idle" aria-live="polite" aria-atomic="true">
      <div class="waveform" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="copy">
        <div class="title-row">
          <strong id="overlay-title">BLCVoice</strong>
          <span id="recording-timer" class="timer" hidden>00:00</span>
        </div>
        <span id="overlay-message">Ready</span>
      </div>

      <span id="shortcut-hint" class="shortcut-hint">Ctrl Shift Space</span>
    </main>
    <script src="overlay.js"></script>
  </body>
</html>
